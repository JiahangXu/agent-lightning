# ==========================
# Variable definitions
# ==========================
variables:
  NUM_GPUS: 1
  MINI_BATCH_SIZE: 1
  PER_GPU_BATCH_SIZE: 1
  TENSOR_MODEL_PARALLEL_SIZE: 1
  NUM_ROLLOUTS: 1
  BASE_MODEL: Qwen/Qwen2.5-1.5B-Instruct
  PROJECT_NAME: AGL-v1-ScienceWorld
  TASK_NUM: ${oc.env:TASK_NUM,25}
  EXPERIMENT_NAME: grpo-${variables.TASK_NUM}-sciworld
  DATA_DIR: examples/simulation/task_data/scienceworld/single_data/${variables.TASK_NUM}

# ==========================
# Main Config
# ==========================
agentlightning:
  port: 9999

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  use_return_as_reward: false

data:
  train_files: ${variables.DATA_DIR}/train.parquet
  val_files: ${variables.DATA_DIR}/test.parquet
  train_batch_size: 1
  val_batch_size: 140
  max_prompt_length: 16384
  max_response_length: 512
  truncation: error

actor_rollout_ref:
  rollout:
    tensor_model_parallel_size: ${variables.TENSOR_MODEL_PARALLEL_SIZE}
    n: ${variables.NUM_ROLLOUTS}
    log_prob_micro_batch_size_per_gpu: ${variables.PER_GPU_BATCH_SIZE}
    multi_turn:
      format: hermes
    name: vllm
    gpu_memory_utilization: 0.55
  actor:
    ppo_mini_batch_size: ${variables.MINI_BATCH_SIZE}
    ppo_micro_batch_size_per_gpu: ${variables.PER_GPU_BATCH_SIZE}
    optim:
      lr: 1.0e-6
    use_kl_loss: false
    kl_loss_coef: 0.0
    entropy_coeff: 0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.3
    fsdp_config:
      param_offload: true
      optimizer_offload: true
  ref:
    log_prob_micro_batch_size_per_gpu: ${variables.PER_GPU_BATCH_SIZE}
    fsdp_config:
      param_offload: true
  model:
    path: Qwen/Qwen2.5-1.5B-Instruct
    use_remove_padding: true
    enable_gradient_checkpointing: true

trainer:
  n_gpus_per_node: ${variables.NUM_GPUS}
  val_before_train: false
  critic_warmup: 0
  logger:
    - console
    - wandb
  project_name: ${variables.PROJECT_NAME}
  experiment_name: ${variables.EXPERIMENT_NAME}
  nnodes: 1
  save_freq: 256
  test_freq: 5
  total_epochs: 300

tips:
  use_tips: True
  off_policy_probs: 0.67